# llm-pivot configuration.
# Rewritten by the monitor page; hand-written comments are not preserved.
monitor_port: 8061
router_port: 8078
host: 127.0.0.1
startup_timeout_seconds: 180
graceful_stop_timeout_seconds: 20
inactive_stop_timeout_seconds: 600
log_lines: 4000
engines:
    - name: llama.cpp
      port: 8080
      command: llama-server --models-max 1 --sleep-idle-seconds 600 --models-autoload --jinja --flash-attn on --cache-type-k q8_0 --cache-type-v q4_0 --n-gpu-layers 99 --ubatch-size 512 --batch-size 1024 --reasoning-format deepseek --reasoning-effort medium --reasoning-budget 2040 --reasoning-budget-message "Thinking time expired. Formulate your final response now." --device Vulkan1 --sse-ping-interval 30 --fit off --timeout 600
      monitor: stdio
      monitor_interval_seconds: 5
      health_path: /health
      port_flag: --port
      models:
        - name: ascii-qwen3.8:27b
          options: -m ~/models/ascii-qwen3.8:27b --ctx-size 170000 --spec-type draft-mtp,ngram-mod --spec-ngram-mod-n-match 24 --spec-ngram-mod-n-min 8 --spec-ngram-mod-n-max 32 --spec-draft-n-max 4 --spec-draft-p-min 0.75
    - name: strata
      port: 8024
      command: ~/Strata/.venv/bin/python ~/Strata/serve/server.py --engine strata --port 8024
      monitor: embed
      monitor_url: http://127.0.0.1:{{port}}/#monitor
      monitor_interval_seconds: 5
      health_path: /health
      port_flag: '-'
      work_dir: ~/Strata
      models:
        - name: swift-1.5-iq2_xs
          options: --config ~/models/strata-swift-iq2_xs.json
